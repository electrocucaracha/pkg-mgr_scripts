name: Run misspell
# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - "**.md"
      - "!.github/*"
      - ".github/.wordlist.txt"
      - ".spellcheck.yml"
  pull_request:
    branches:
      - master
    paths:
      - "**.md"
      - "!.github/*"
      - ".github/.wordlist.txt"
      - ".spellcheck.yml"
  pull_request_review:
    types:
      - submitted
permissions:
  contents: read
jobs:
  check-reviewdog:
    name: Check misspelling words with reviewdog tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-misspell@ba7ac4030fa6812f8c8b2d4e516af8bc99553c32 # v1.28.0
        with:
          github_token: ${{ secrets.github_token }}
  check-spellcheck:
    name: Check misspelling words with pySpelling tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: igsekor/pyspelling-any@44278deea34ea69d8f0d5179ac409c140b0a2f5a # v1.0.5
        name: Spellcheck
