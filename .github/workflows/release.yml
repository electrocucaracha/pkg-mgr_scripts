name: Release dev container features
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List features
        id: list
        run: |
          features=$(find src -mindepth 2 -maxdepth 2 -name devcontainer-feature.json -print \
            | sed -E 's|^src/([^/]+)/devcontainer-feature\.json$|\1|' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "features=$features" >> "$GITHUB_OUTPUT"
  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.discover.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Test Feature
        env:
          FEATURE: ${{ matrix.feature }}
        run: npx --yes @devcontainers/cli@0.88.0 features test -p . --features "$FEATURE" -i mcr.microsoft.com/devcontainers/base:ubuntu
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish Features
        run: npx --yes @devcontainers/cli@0.88.0 features publish -r ghcr.io -n "${{ github.repository }}" ./src
